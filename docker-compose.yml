# Local development stack: MySQL 8.4 LTS, Redis 7 and LocalStack (S3).
#   docker compose up -d
# Values come from backend/.env (DB_NAME, DB_USER, DB_PASSWORD, DB_PORT, …).
# Ports are bound to 127.0.0.1 only and default to the same ports as the
# Homebrew setup in the README (MySQL 3307, Redis 6379): run one or the other.
# Not for production; the production image comes with the deployment phase.
name: kuchu-puchu

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-root-only}
      MYSQL_DATABASE: ${DB_NAME:-kuchu_puchu}
      MYSQL_USER: ${DB_USER:-kuchu_puchu}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates kuchu_puchu_test (utf8mb4_0900_ai_ci) for the app user on first start.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  localstack:
    # Pinned to the 3.x community image, which needs no account or auth token.
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      # Creates the private media buckets (S3 Block Public Access on) when ready.
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(running\\|available\\)\"'"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  redis-data:
  localstack-data:
